<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f0e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Plate</title>
<style>
:root{
  --bg:#f4f0e9; --card:#ffffff; --ink:#1b1a17; --muted:#77736a; --line:#e8e2d7; --soft:#f1ece3;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e1f0e7;
  --warn:#c4571a; --warn-soft:#fbe8dc;
  --p:#4a6cf7; --c:#e3a008; --f:#e5574b;
  --shadow:0 1px 2px rgba(20,18,10,.05),0 10px 30px rgba(20,18,10,.07);
  --scrim:rgba(20,18,10,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f0d; --card:#181a17; --ink:#f3f0e8; --muted:#9b978c; --line:#2a2c27; --soft:#22241f;
    --accent:#4cc487; --accent-ink:#06210f; --accent-soft:#17301f;
    --warn:#f08c52; --warn-soft:#33200f;
    --p:#7b94ff; --c:#f0b72f; --f:#ff7a6e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f0d; --card:#181a17; --ink:#f3f0e8; --muted:#9b978c; --line:#2a2c27; --soft:#22241f;
  --accent:#4cc487; --accent-ink:#06210f; --accent-soft:#17301f;
  --warn:#f08c52; --warn-soft:#33200f;
  --p:#7b94ff; --c:#f0b72f; --f:#ff7a6e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 150px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 12px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);background:var(--card);border:1px solid var(--line)}
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;height:36px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.lnk{font-weight:700;text-decoration:underline;white-space:nowrap}
.det{display:block;margin-top:8px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);background:var(--soft);padding:8px 10px;border-radius:10px;word-break:break-word;-webkit-user-select:text;user-select:text}

/* hero ring */
.hero{display:flex;align-items:center;gap:16px;padding:16px}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--soft)}
.ring .prg{stroke:var(--accent);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring.over .prg{stroke:var(--warn)}
.ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ctr b{font-size:34px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ctr span{font-size:12px;color:var(--muted);margin-top:4px}
.mac{flex:1;min-width:0;display:grid;gap:11px}
.pill{justify-self:start;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.over{background:var(--warn-soft);color:var(--warn)}
.mrow .mh{display:flex;justify-content:space-between;font-size:13px}
.mrow .mh span{color:var(--muted)}
.bar-t{height:6px;background:var(--soft);border-radius:6px;margin-top:5px;overflow:hidden}
@media (max-width:360px){.hero{gap:12px;padding:14px}.ring{width:118px;height:118px}.ctr b{font-size:28px}.mrow .mh{font-size:12px;gap:6px}.pill{font-size:12px}}
.bar-t i{display:block;height:100%;border-radius:6px}

/* sections + meals */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.meal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px 10px 10px;margin-bottom:10px}
.meal.flat{border:0;box-shadow:none;border-radius:0;margin:0;border-top:1px solid var(--line);background:none}
.thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--muted)}
.thumb.big{width:64px;height:64px;border-radius:16px}
.thumb.sm{width:34px;height:34px;border-radius:10px}
.thumb.sm svg{width:20px;height:20px}
.mm{flex:1;min-width:0;display:grid;gap:3px}
.mname{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmeta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.mk{text-align:right;flex:none}
.mk b{font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mk small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted);flex:none}
.dot.high{background:var(--accent)} .dot.medium{background:var(--c)} .dot.low{background:var(--warn)}
.fresh{animation:pop .5s cubic-bezier(.2,.9,.3,1.2),glow 2.8s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,60%{border-color:var(--accent)}100%{border-color:var(--line)}}

/* log again + nudge */
.rec{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rec::-webkit-scrollbar{display:none}
.rc{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;max-width:230px;text-align:left;box-shadow:var(--shadow)}
.rc .rt{display:grid;min-width:0}
.rc b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rc small{font-size:11.5px;color:var(--muted)}
.nudge{padding:14px;margin-top:10px;display:grid;gap:4px}
.nudge span{font-size:13px;color:var(--muted)}
.nudge .acts{display:flex;gap:8px;margin-top:8px}

/* busy + fail */
.busy,.fail{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:12px}
.fail{align-items:flex-start;border-color:var(--warn)}
.bimg{position:relative;width:72px;height:72px;border-radius:16px;overflow:hidden;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--muted)}
.bimg img{width:100%;height:100%;object-fit:cover;display:block}
.shim{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.btxt{flex:1;min-width:0;display:grid;gap:2px}
.btxt span{font-size:12.5px;color:var(--muted)}
.btn{height:40px;padding:0 14px;border-radius:12px;font-weight:600;font-size:14px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--warn)}
.btn.wide{width:100%;margin-top:14px}
.btn:disabled{opacity:.5}
.fail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* empty */
.empty{text-align:center;padding:28px 18px;color:var(--muted);margin-top:14px}
.empty h3{color:var(--ink);margin:10px 0 4px;font-size:18px}
.empty p{margin:0}
.tips{text-align:left;margin:16px auto 0;max-width:340px;font-size:13.5px;display:grid;gap:8px}
.tips div{display:flex;gap:10px}
.tips i{font-style:normal;flex:none}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:26px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent);pointer-events:none}
.dockin{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;pointer-events:auto}
.dock .sec{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.snap{flex:1;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(31,122,77,.35)}
.dock button:disabled{opacity:.45}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;animation:fade .2s forwards}
.scrim.still{animation:none;opacity:1}
@keyframes fade{to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:90%;overflow:auto;overscroll-behavior:contain;background:var(--card);border-radius:24px 24px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet.still{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.sh-title{flex:1;min-width:0}
h2{margin:0;font-size:19px;line-height:1.2}
.sh-sub{font-size:13px;color:var(--muted)}
.x{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--muted)}
.bigk{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}
.bigk b{font-size:52px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bigk span{color:var(--muted);font-weight:600}
.rng{font-size:13.5px;color:var(--muted)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:16px 0 6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-width:0;height:40px;border-radius:12px;background:var(--soft);font-weight:600;font-size:14px;white-space:nowrap;padding:0 4px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
@media (max-width:400px){.seg button{font-size:13px}}
@media (max-width:340px){.seg button{font-size:12px;padding:0 2px}.acts2 .btn{font-size:14px;padding:0 6px}}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;background:var(--soft);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.chip b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.items{margin-top:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:flex;gap:10px;align-items:center;padding:8px 10px 8px 12px;font-size:14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .n{flex:1;min-width:0;line-height:1.25}
.it .n small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;margin-top:1px}
.it .k{width:44px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.it.off .n,.it.off .k{opacity:.45}
.it.off .n{text-decoration:line-through}
.stp{display:flex;gap:6px;flex:none}
.stp button{width:34px;height:34px;border-radius:11px;background:var(--soft);font-size:19px;font-weight:700;line-height:1;display:grid;place-items:center}
.stp button:active{background:var(--line)}
.why{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.fix{display:flex;gap:8px}
.qf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qf button{height:32px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],textarea{width:100%;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:11px 12px;font-size:16px;min-height:44px;outline:0;-webkit-appearance:none;appearance:none}
textarea{resize:none}
input:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:12px}
label>input,label>textarea{margin-top:5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts2{display:flex;gap:10px;margin-top:18px}
.acts2 .btn{flex:1;height:46px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.err{font-size:13px;color:var(--warn);margin-top:8px}
details{margin-top:12px} summary{font-size:13px;color:var(--muted);cursor:pointer}
.pthumb{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}
.swrow b{font-size:15px}
.sw{width:52px;height:32px;border-radius:32px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(20px)}

/* toast */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:60;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateY(0);pointer-events:auto}
.toast span{min-width:0}
body.noscroll .toast{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));transform:translateY(-20px)}
body.noscroll .toast.show{transform:translateY(0)}
.toast button{font-weight:700;text-decoration:underline;flex:none;white-space:nowrap}

/* history */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.sum .card{padding:12px}
.sum b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.chart{padding:12px 12px 6px;margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block}
.bar{fill:var(--accent);opacity:.72}
.bar.today{opacity:1}
.bar.over{fill:var(--warn)}
.bar.pr{fill:var(--p);opacity:.5}
.bar.pr.today{opacity:.8}
.bar.pr.hit{opacity:1}
.bar.empty{fill:var(--line);opacity:1}
.goal{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.ax,.gl{fill:var(--muted);font-size:10px}
.dayc{margin-bottom:10px;overflow:hidden}
.day{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;text-align:left}
.day small{display:block;font-size:12px;color:var(--muted)}
.day .dk{text-align:right}
.day .dk b{font-size:19px;font-variant-numeric:tabular-nums}
.day .dk.over small{color:var(--warn)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="eyebrow" id="dateLabel"></div><h1 id="title">Today</h1></div>
    <button class="icon-btn" id="btnSettings" data-act="settings" aria-label="Settings"></button>
  </header>
  <nav class="tabs">
    <button data-act="tab" data-tab="today" class="on">Today</button>
    <button data-act="tab" data-tab="history">History</button>
  </nav>
  <main id="view"></main>
</div>

<div class="dock"><div class="dockin">
  <button class="sec" id="btnLib" data-act="lib" aria-label="Choose a photo from your library"></button>
  <button class="snap" id="btnSnap" data-act="snap"></button>
  <button class="sec" id="btnManual" data-act="manual" aria-label="Log a meal without a photo"></button>
</div></div>

<div id="sheetHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input class="vh" id="fileCam" type="file" accept="image/*" capture="environment" tabindex="-1">
<input class="vh" id="fileLib" type="file" accept="image/*" tabindex="-1">

<script>
/* Plate standalone runtime.
   Gives the app the same window.claude surface it gets inside Claude:
     sample    -> Anthropic Messages API, called straight from this device with your own API key
     db        -> IndexedDB on this device (in-memory mirror, write-through)
     user      -> a fixed local id
     downloads -> iOS share sheet, falling back to a normal file download
   Nothing here talks to any server except api.anthropic.com. */
(function () {
'use strict';

var LS = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
var KEY_K = 'plate.apiKey', MODELS_K = 'plate.models', HINT_K = 'plate.installHint', COMPAT_K = 'plate.compat';
var UID = 'local';
var API = 'https://api.anthropic.com/v1/messages';
var DEFAULT_MODELS = {std: 'claude-sonnet-5-5', max: 'claude-opus-5-5'};
var EFFORT = {std: 'medium', max: 'high'};
var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

/* ---------- settings kept outside the log (never exported in backups) ---------- */
function getKey() { return (LS.get(KEY_K) || '').trim(); }
function setKey(k) { k = String(k || '').trim(); if (k) LS.set(KEY_K, k); else LS.del(KEY_K); }
function keyHint() { var k = getKey(); return k ? '\u2026' + k.slice(-4) : ''; }
function models() {
  var m = {};
  try { m = JSON.parse(LS.get(MODELS_K) || '{}') || {}; } catch (e) {}
  return {std: String(m.std || '').trim() || DEFAULT_MODELS.std, max: String(m.max || '').trim() || DEFAULT_MODELS.max};
}
function setModels(m) {
  var std = String((m && m.std) || '').trim(), max = String((m && m.max) || '').trim(), out = {};
  if (std && std !== DEFAULT_MODELS.std) out.std = std;
  if (max && max !== DEFAULT_MODELS.max) out.max = max;
  if (Object.keys(out).length) LS.set(MODELS_K, JSON.stringify(out)); else LS.del(MODELS_K);
}
/* what the API has accepted for this key so far (e.g. no effort field, smaller max_tokens) */
function getCompat() { try { return JSON.parse(LS.get(COMPAT_K) || '{}') || {}; } catch (e) { return {}; } }
function setCompat(c) { LS.set(COMPAT_K, JSON.stringify(Object.assign(getCompat(), c))); }
function clearCompat() { LS.del(COMPAT_K); }
function applyCompat(body, c) {
  var b = Object.assign({}, body);
  if (c.noEffort) delete b.output_config;
  if (c.maxTokens) b.max_tokens = Math.min(b.max_tokens, c.maxTokens);
  return b;
}

/* ================= item quantities ================= */
var NOPLURAL = {tsp: 1, tbsp: 1, ml: 1, l: 1, g: 1, kg: 1, oz: 1, lb: 1, cm: 1};
function fmtCount(n){
  n = Math.round(n * 4) / 4;
  var w = Math.floor(n), f = Math.round((n - w) * 100) / 100;
  var fr = f === 0.25 ? '\u00BC' : f === 0.5 ? '\u00BD' : f === 0.75 ? '\u00BE' : '';
  return fr ? (w ? String(w) : '') + fr : String(w);
}
function plural(u, n){
  u = String(u || '').trim();
  if (!u || n <= 1 || NOPLURAL[u.toLowerCase()] || /[^s]s$/i.test(u)) return u;
  return /(s|x|z|ch|sh)$/i.test(u) ? u + 'es' : u + 's';
}
function singular(u){
  u = String(u || '').trim().toLowerCase();
  if (/ies$/.test(u) && u.length > 4) return u.slice(0, -3) + 'y';
  if (/(sses|xes|ches|shes|zes)$/.test(u)) return u.slice(0, -2);
  if (/[^s]s$/.test(u) && u.length > 3) return u.slice(0, -1);
  return u;
}
var itemX = function(i){ return (i && typeof i.x === 'number' && i.x >= 0) ? i.x : 1; };
function itemQty(i, xm){
  var ix = itemX(i) * xm, parts = [];
  if (i.cnt > 0) { var c = i.cnt * ix; parts.push(fmtCount(c) + (i.u ? ' ' + plural(i.u, Math.round(c * 4) / 4) : '')); }
  parts.push(Math.round(i.g * ix) + ' g');

}
function sumItems(items){
  var t = {k: 0, p: 0, c: 0, f: 0};
  items.forEach(function(i){ var x = itemX(i); t.k += i.k * x; t.p += i.p * x; t.c += i.c * x; t.f += i.f * x; });
  return {k: Math.round(t.k), p: Math.round(t.p), c: Math.round(t.c), f: Math.round(t.f)};
}

function buildPrompt(o){

  L.push('3. HIDDEN FAT is the biggest source of error in Indian food, so count it explicitly: tadka or tempering oil and ghee, ghee or butter on roti, paratha, rice or dal, oil in sabzi, cream, malai, butter and cashew paste in restaurant gravies, frying oil, ghee and sugar in sweets, and milk and sugar in chai. Typical home cooking uses about 1 tsp (5 g) of oil or ghee per katori of dal or dry sabzi and 1.5-2 tsp per katori of gravy. Restaurant, dhaba and takeaway food usually has 2-3x that. A visible oil film or a red-orange oil layer on top means high fat. 1 tsp ghee = 45 kcal, oil = 40, butter = 36, sugar = 20.');

  L.push('7. Use cooked weights, never dry weights, for cooked food: rice about 1.3 kcal/g, thin dal 0.6-0.9, thick dal, rajma or chole 1.0-1.5 (before added fat), plain curd 0.6-0.9.');
  L.push('8. Protein matters to this user. Do not inflate protein for rice or roti dishes; credit paneer (about 18 g per 100 g), dal (6-9 g per katori), curd (3-4 g per 100 g), milk (8 g per glass), soy chunks, sprouts and besan realistically.');
  L.push('9. Typical values to anchor on (kcal per serving as eaten; adjust to what you see): ' + ANCHORS);
  L.push('10. Give your best central estimate (not low-balled, not padded), then a realistic low-high range that should contain the true value about 80% of the time. Widen it for gravies, fried food, sweets and restaurant food (about 25-35%); tighten it for simple or labelled food (10-15%).');
  L.push('11. total_kcal must equal the sum of the item kcal. Macros are in grams.');

  L.push('count is how many of unit (one singular word such as roti, katori, piece, glass, cup, tsp, tbsp, slice); use count 0 and unit "" when no natural unit applies. setting is "home", "restaurant", "packaged" or "unknown". confidence is "high", "medium" or "low".');

function parseLoose(t){
  t = String(t || '');
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw {code: 'invalid_json', message: 'no json'};
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw {code: 'invalid_json', message: 'bad json'}; }
}
function normalize(r){
  if (!r || typeof r !== 'object' || Array.isArray(r)) throw {code: 'invalid_json', message: 'shape'};
  if (r.is_food === false) return {notFood: true, reason: str(r.reason, 140)};
  var items = (Array.isArray(r.items) ? r.items : []).slice(0, 14).map(function(it){
    it = it || {};
    var cnt = Math.max(0, Math.min(50, Math.round(num(it.count) * 4) / 4)), un = singular(str(it.unit, 16));
    return {
      n: str(it.name, 60) || 'Item',
      cnt: cnt, u: cnt > 0 ? (un || 'piece') : '',
      g: Math.max(0, Math.round(num(it.grams))),
      k: Math.max(0, Math.round(num(it.kcal))),
      p: Math.max(0, r1(num(it.protein_g))), c: Math.max(0, r1(num(it.carbs_g))), f: Math.max(0, r1(num(it.fat_g)))
    };
  });
  var kcal = items.reduce(function(a, i){ return a + i.k; }, 0);
  if (!kcal) kcal = Math.round(num(r.total_kcal));
  if (!(kcal > 0)) throw {code: 'invalid_json', message: 'no calories'};
  var p = r1(items.reduce(function(a, i){ return a + i.p; }, 0));
  var c = r1(items.reduce(function(a, i){ return a + i.c; }, 0));
  var f = r1(items.reduce(function(a, i){ return a + i.f; }, 0));
  if (!(p || c || f)) { p = r1(num(r.protein_g)); c = r1(num(r.carbs_g)); f = r1(num(r.fat_g)); }
  var conf = ['high', 'medium', 'low'].indexOf(r.confidence) >= 0 ? r.confidence : 'medium';
  var spread = {high: .12, medium: .2, low: .32}[conf];
  var low = Math.round(num(r.low_kcal)), high = Math.round(num(r.high_kcal));
  if (!(low > 0 && low <= kcal)) low = Math.round(kcal * (1 - spread));
  if (!(high >= kcal)) high = Math.round(kcal * (1 + spread));
  return {
    name: str(r.meal_name, 80) || (items[0] && items[0].n) || 'Meal',
    items: items, kcal: kcal, p: Math.round(p), c: Math.round(c), f: Math.round(f),
    low: low, high: high, conf: conf, why: str(r.assumptions, 400),
    set: ['home', 'restaurant', 'packaged'].indexOf(r.setting) >= 0 ? r.setting : 'unknown'
  };
}
async function estimate(o, ctl, onFirstText){
  await S.sampleP;
  var s = S.caps.sample;
  if (!s) throw {code: S.denied ? 'not_granted' : 'sampling_disabled'};
  var opts = {signal: ctl.signal, modelTier: S.settings.max ? 'complex' : 'default', cache: false};
  if (o.blob) opts.images = o.blob;
  if (onFirstText) { var fired = false; opts.onText = function(){ if (!fired) { fired = true; onFirstText(); } }; }
  var prompt = buildPrompt({hasImage: !!o.blob, text: o.text, note: o.note, prev: o.prev});
  var raw;
  if (typeof s.json === 'function') raw = await s.json(prompt, opts);
  else { var r = await s(prompt, opts); raw = parseLoose(r && r.text); }
  return normalize(raw);
}

/* ================= image prep ================= */
function readDataURL(file){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = function(){ rej(fr.error || new Error('read')); }; fr.readAsDataURL(file); }); }
function loadImg(src){ return new Promise(function(res, rej){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ rej(new Error('decode')); }; im.src = src; }); }
function toBlob(cv, type, q){ return new Promise(function(res){ cv.toBlob(res, type, q); }); }
async function prepareImage(file){
  var im = await loadImg(await readDataURL(file));
  var W = im.naturalWidth, H = im.naturalHeight;
  if (!W || !H) throw new Error('empty');
  var sc = Math.min(1, 1568 / Math.max(W, H));
  var cv = document.createElement('canvas'); cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
  cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
  var blob = await toBlob(cv, 'image/jpeg', 0.86);
  if (!blob) throw new Error('encode');
  var ps = Math.min(1, 480 / Math.max(W, H));
  var pv = document.createElement('canvas'); pv.width = Math.round(W * ps); pv.height = Math.round(H * ps);
  pv.getContext('2d').drawImage(im, 0, 0, pv.width, pv.height);
  var T = 112, tc = document.createElement('canvas'); tc.width = T; tc.height = T;
  var s = Math.min(W, H);
  tc.getContext('2d').drawImage(im, (W - s) / 2, (H - s) / 2, s, s, 0, 0, T, T);
  return {blob: blob, preview: pv.toDataURL('image/jpeg', 0.7), thumb: tc.toDataURL('image/jpeg', 0.62)};
}

var dirty = {};                       // meal id -> pending quantity edits {ver, t, base}
function markDirty(id, base){
  var d = dirty[id] || (dirty[id] = {ver: 0, base: base});
  d.ver++; clearTimeout(d.t);
  d.t = setTimeout(function(){ flushMeal(id); }, 450);
}
function flushMeal(id){
  var d = dirty[id]; if (!d) return Promise.resolve();
  clearTimeout(d.t);
  var m = byId(id), v = d.ver;
  if (!m) { delete dirty[id]; return Promise.resolve(); }
  var done = function(){ if (dirty[id] && dirty[id].ver === v) delete dirty[id]; };
  if (S.mode !== 'db') { done(); return Promise.resolve(); }
  var patch = {items: m.items, kcal: m.kcal, p: m.p, c: m.c, f: m.f, low: m.low, high: m.high};
  return serial('m:' + id, function(){ return S.prof.collection('meals').doc(id).update(patch); }).then(done, function(){
    var base = d.base; delete dirty[id];
    S.meals = S.meals.map(function(x){ return x.id === id ? base : x; }); render();
    toast('Couldn\u2019t save that change');
  });
}
function flushAll(){ Object.keys(dirty).forEach(function(id){ flushMeal(id); }); }
function stepItem(id, idx, dir){
  var m = byId(id); if (!m || m.edited || !m.items || !m.items[idx]) return;
  var items = m.items.map(function(i){ return Object.assign({}, i); });
  var it = items[idx], xm = mult(m);
  var b = it.cnt > 0 ? it.cnt : 1, st = it.cnt > 0 ? (it.cnt >= 2 ? 1 : 0.5) : 0.25;
  var cur = b * itemX(it) * xm, nxt = Math.max(0, Math.round((cur + dir * st) * 4) / 4);
  if (nxt === cur) return;
  it.x = Math.min(8, Math.round(nxt / (b * xm) * 1000) / 1000);
  var t = sumItems(items), low, high;
  if (m.kcal > 0 && m.high > m.low) { low = Math.round(m.low * t.k / m.kcal); high = Math.round(m.high * t.k / m.kcal); }
  else { var sp = {high: .12, medium: .2, low: .32}[m.conf] || .2; low = Math.round(t.k * (1 - sp)); high = Math.round(t.k * (1 + sp)); }

  busy.stage = 'Analyzing\u2026'; if (input.preview) busy.preview = input.preview;
  render();
  var est;
  try {
    est = await estimate(input, busy.ctl, function(){
      if (S.busy === busy) { busy.stage = 'Totaling it up\u2026'; var el = $('#busyStage'); if (el) el.textContent = busy.stage; }
    });

    if (S.busy !== busy) return;

      if (code === 'not_granted') { S.denied = true; S.caps.sample = null; }

      S.failed = {kind: 'analyze', code: code, message: errMsg(code), detail: apiDetail(e, code), input: input, canRetry: ['not_granted', 'sampling_disabled', 'images_unavailable', 'session_expired', 'no_key', 'bad_key', 'bad_model'].indexOf(code) < 0};

    S.failed = {kind: 'notfood', message: est.reason ? 'That doesn\u2019t look like food: ' + est.reason : 'That doesn\u2019t look like food.', input: input};
    render(); return;
  }
  var doc = buildDoc(est, input);

    var id = await saveMeal(doc, input.blob);

}

function chartSVG(tt, goal, todayK, o){

  var max = Math.max.apply(null, [goal * 1.25, 1].concat(tt.map(function(t){ return t.kcal; })));
  var bw = (W - pl - pr) / tt.length;
  var y = function(v){ return pt + (H - pt - pb) * (1 - v / max); };
  var bars = '', labels = '';
  tt.forEach(function(t, i){
    var x = pl + i * bw + bw * 0.18, w = bw * 0.64;
    var yy = t.kcal > 0 ? y(t.kcal) : H - pb - 2, h = (H - pb) - yy;
    var cls = 'bar' + (isP ? ' pr' + (t.kcal >= goal ? ' hit' : '') : (t.kcal > goal ? ' over' : '')) + (t.k === todayK ? ' today' : '') + (t.kcal ? '' : ' empty');
    bars += '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3.5"/>';
    labels += '<text class="ax" x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + 'SMTWTFS'.charAt(keyToDate(t.k).getDay()) + '</text>';
  });
  var gy = y(goal).toFixed(1);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (isP ? 'Protein' : 'Calories') + ' per day for the last 14 days">' + bars +
    '<line class="goal" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + gy + '" y2="' + gy + '"/>' + labels +
    '<text class="gl" x="' + (W - pr) + '" y="' + (gy - 4) + '" text-anchor="end">goal ' + fmt(goal) + (isP ? ' g' : '') + '</text></svg>';
}

      (open ? list.map(function(m){ return mealCard(m, true); }).join('') : '') + '</div>';
  }).join('');
  return html;

function renderSheet(){

  $$('[data-keep]', host).forEach(function(el){ S.keep[el.id] = el.value; });
  var ae = document.activeElement, aid = (ae && ae !== document.body && host.contains(ae)) ? ae.id : '', ss = null, se = null;
  if (aid) { try { ss = ae.selectionStart; se = ae.selectionEnd; } catch (e) {} }
  var sh = S.sheet, body = '';
  if (sh.type === 'meal') { var m = byId(sh.id); if (!m) { closeSheet(); return; } body = sh.mode === 'edit' ? sheetEditHTML(m) : sheetMealHTML(m); }
  else if (sh.type === 'manual') body = sheetManualHTML();

    if (ne) { try { ne.focus({preventScroll: true}); if (ss != null && ne.setSelectionRange) ne.setSelectionRange(ss, se); } catch (e) {} }

function pick(kind){
  if (S.busy) return;
  var inp = $(kind === 'cam' ? '#fileCam' : '#fileLib');
  inp.value = ''; inp.click();
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.dataset.act, sh = S.sheet;
  switch (a) {
    case 'tab': S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'snap': pick('cam'); break;
    case 'lib': pick('lib'); break;
    case 'manual': openSheet({type: 'manual'}); break;
    case 'settings': openSheet({type: 'settings'}); break;
    case 'open': openSheet({type: 'meal', id: el.dataset.id, mode: 'view'}); break;
    case 'close': closeSheet(); break;
    case 'cancel': if (S.busy) { S.busy.ctl.abort(); stopBusy(); render(); } break;
    case 'retry':
      if (S.failed && S.failed.kind === 'analyze') { var inp = S.failed.input; S.failed = null; analyze(inp); }
      else if (S.failed && S.failed.kind === 'save') {
        var f = S.failed; S.failed = null; render();
        saveMeal(f.doc, f.blob).then(function(id){ toast('Saved \u00B7 ' + fmt(f.doc.kcal) + ' kcal', {label: 'Details', id: id}); })
          .catch(function(err){ S.failed = {kind: 'save', message: dbMsg(err), doc: f.doc, blob: f.blob}; render(); });
      }
      break;
    case 'dismiss': S.failed = null; render(); break;
    case 'fail-manual': S.pendingThumb = (S.failed && S.failed.input && S.failed.input.thumb) || ''; S.failed = null; render(); openSheet({type: 'manual'}); break;
    case 'mult': if (sh && sh.type === 'meal') patchMeal(sh.id, {mult: Number(el.dataset.v)}).catch(function(){ toast('Couldn\u2019t save that change'); }); break;
    case 'mtype': if (sh && sh.type === 'meal') patchMeal(sh.id, {meal: el.dataset.v}).catch(function(){ toast('Couldn\u2019t save that change'); }); break;
    case 'edit': if (sh) { sh.mode = 'edit'; sh.err = ''; S.keep = {}; renderSheet(); } break;
    case 'edit-cancel': if (sh) { sh.mode = 'view'; sh.err = ''; S.keep = {}; renderSheet(); } break;
    case 'edit-save': saveEdit(); break;
    case 'del':
      if (sh && sh.type === 'meal') {
        if (!sh.confirmDel) { sh.confirmDel = true; renderSheet(); setTimeout(function(){ if (S.sheet === sh && sh.confirmDel) { sh.confirmDel = false; renderSheet(); } }, 3500); }
        else { var id = sh.id; closeSheet(); removeMeal(id).then(function(){ toast('Deleted'); }).catch(function(){ toast('Couldn\u2019t delete that entry'); }); }
      }
      break;
    case 'fix': fixMeal(); break;
    case 'manual-save': saveManual(); break;
    case 'toggle-max': saveSettings({max: !S.settings.max}); break;
    case 'export': exportCsv(); break;
    case 'day': S.openDays[el.dataset.k] = !S.openDays[el.dataset.k]; render(); break;
    case 'toast-act':
      hideToast();
      if (el.dataset.kind === 'undo') removeMeal(el.dataset.id).then(function(){ toast('Removed'); }).catch(function(){ toast('Couldn\u2019t undo that'); });
      else openSheet({type: 'meal', id: el.dataset.id, mode: 'view'});
      break;
    case 'istep': if (sh && sh.type === 'meal') stepItem(sh.id, Number(el.dataset.i), Number(el.dataset.d)); break;
    case 'qf':
      var qi = $('#fixNote');
      if (qi && !qi.disabled) qi.value = (qi.value && !/\s$/.test(qi.value) ? qi.value + ' ' : qi.value) + el.dataset.t;
      break;
    case 'again': logAgain(el.dataset.id); break;
    case 'diet': saveSettings({diet: el.dataset.v}); break;
    case 'sugg':
      var ta = $('#kitchenIn');
      if (ta) {
        ta.value = (ta.value && !/\s$/.test(ta.value) ? ta.value + ' ' : ta.value) + el.dataset.t;
        S.touched = true; ta.focus(); var bi = ta.value.lastIndexOf('___'); if (bi >= 0) ta.setSelectionRange(bi, bi + 3);
        clearTimeout(S.kitT); S.kitT = setTimeout(saveKitchenNow, 1200);
      }
      break;
    case 'nudge-go': saveSettings({nudge: true}, true); openSheet({type: 'settings'}); var kt = $('#kitchenIn'); if (kt) kt.focus({preventScroll: true}); break;
    case 'nudge-x': saveSettings({nudge: true}); break;
    case 'open-key': S.failed = null; openSheet({type: 'settings'}); focusKey(); break;
    case 'hint-x': if (window.claude && window.claude.dismissInstallHint) window.claude.dismissInstallHint(); render(); break;
    case 'key-save': saveKeyAndTest(); break;
    case 'key-remove': if (window.claude && window.claude.clearKey) { window.claude.clearKey(); S.keyMsg = 'Key removed.'; render(); } break;
    case 'backup': doBackup(); break;
    case 'restore': var fr = $('#fileRestore'); if (fr) { fr.value = ''; fr.click(); } break;
  }
});

    S.caps.sample = s;
    if (s) { try { var l = await s.limits(); S.caps.img = (l && l.images) ? l.images : null; } catch (e) { S.caps.img = null; } }
    else S.caps.img = null;
    render();
  });
  safe('downloads').then(function(d){ S.caps.downloads = d; if (S.sheet && S.sheet.type === 'settings') renderSheet(); });
  render();
  var res = await Promise.all([safe('db'), safe('user')]);
  var uid = null;
  if (res[1]) { try { uid = await res[1].id(); } catch (e) {} }
  if (res[0] && uid) { S.db = res[0]; S.prof = S.db.doc('data/users/' + uid + '/profile'); S.mode = 'db'; subscribe(); }
  else S.mode = 'memory';
  S.readyRes();
  render();
}
init();
})();
</script>
</body>
</html>
